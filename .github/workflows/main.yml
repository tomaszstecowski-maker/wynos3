# Buduje aplikację WynOs na iPhone'a (.ipa, niepodpisaną) na komputerze Apple w chmurze GitHub.
# Działa też wtedy, gdy pliki zostały wgrane bez folderów (wszystko w jednym miejscu).
# Instalacja na telefonie: Sideloadly (Windows) albo – po publikacji – App Store.
name: Zbuduj WynOs (iPhone)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Uloz pliki w folderach
        run: |
          set -e
          if [ ! -f ios/project.yml ]; then
            mkdir -p ios/WynOs
            mv project.yml ios/
            mv ./*.swift ios/WynOs/
            if [ -f PrivacyInfo.xcprivacy ]; then mv PrivacyInfo.xcprivacy ios/WynOs/; fi
          fi
          if ls ios/WynOs/STEC*.swift >/dev/null 2>&1; then
            echo "::error::W repozytorium są stare pliki S-TEC (STEC*.swift) – usuń je albo użyj nowego repozytorium."
            exit 1
          fi
          A=ios/WynOs/Assets.xcassets
          mkdir -p "$A/AppIcon.appiconset" "$A/Logo.imageset"
          if [ ! -f "$A/AppIcon.appiconset/icon-1024.png" ]; then
            cp "$(find . -name 'icon-1024.png' -not -path './ios/WynOs/Assets.xcassets/*' | head -n 1)" "$A/AppIcon.appiconset/icon-1024.png"
          fi
          if [ ! -f "$A/Logo.imageset/logo-mark.png" ]; then
            cp "$(find . -name 'logo-mark.png' -not -path './ios/WynOs/Assets.xcassets/*' | head -n 1)" "$A/Logo.imageset/logo-mark.png"
          fi
          printf '%s' '{"info":{"author":"xcode","version":1}}' > "$A/Contents.json"
          printf '%s' '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$A/AppIcon.appiconset/Contents.json"
          printf '%s' '{"images":[{"filename":"logo-mark.png","idiom":"universal"}],"info":{"author":"xcode","version":1}}' > "$A/Logo.imageset/Contents.json"
          find ios -type f | sort

      - name: Narzedzia
        run: brew install xcodegen

      - name: Projekt Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Kompilacja
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project WynOs.xcodeproj -target WynOs -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 80

      - name: Pakiet ipa
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/WynOs.app Payload/
          if [ -f Payload/WynOs.app/PrivacyInfo.xcprivacy ]; then echo "PrivacyInfo OK"; else echo "::warning::brak PrivacyInfo.xcprivacy w aplikacji"; fi
          zip -qry WynOs.ipa Payload
          ls -la WynOs.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WynOs-ipa
          path: ios/WynOs.ipa
